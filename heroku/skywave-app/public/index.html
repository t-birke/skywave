<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
    <title>Skywave Airlines</title>
    <link rel="stylesheet" href="/assets/website.css">
    <link rel="stylesheet" href="/assets/skywave-customer.css">
    <link rel="stylesheet" href="/assets/skywave-seatmap.css">
    <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
    <!-- Skywave Airlines website backdrop. Rendered once on boot, never
         re-rendered. -->
    <main id="site-root"></main>

    <!-- Demo flow modal layer. Visibility + content driven by stage. -->
    <div id="modal-root" class="sw-modal" data-state="hidden" aria-hidden="true">
        <div class="sw-modal-backdrop" data-action="close-modal"></div>
        <div class="sw-modal-card" role="dialog" aria-modal="true" aria-labelledby="sw-modal-title">
            <button type="button" class="sw-modal-close" data-action="close-modal" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="sw-modal-content" id="modal-content"></div>
        </div>
    </div>

    <script type="module" src="/assets/site.js" defer></script>
</body>
</html>
