name: refresh-observability

# Keep the Agentforce observability dashboards "today-fresh" without a human.
#
# ┌─ WHERE THE DAILY JOB ACTUALLY RUNS ─────────────────────────────────────────┐
# │ NOT here on a schedule. This org's GitHub IP allow list blocks hosted        │
# │ runners, so the scheduled run lives in a personal-account mirror:            │
# │     github.com/t-birke/skywave-observability-refresh  (identical workflow)   │
# │ This file is the canonical source of the scripts + design and is             │
# │ dispatch-only here. See the `on:` block below and SECRETS.md.                │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# WHY THIS RUNS A BROWSER IN CI (and can't be pure API/Apex)
# The SalesforceDotCom data streams that feed the STDM DMOs reject EVERY
# non-interactive caller on their run endpoint ("Connector type SalesforceDotCom
# is not allowed to run in non-interactive mode") — that blocks the Connect REST
# run endpoint AND scheduled Apex alike. The only path is a genuine in-page
# Lightning "Refresh Now" click, which is exactly what scripts/refreshDataStreams.mjs
# drives via Playwright. Salesforce can't schedule a browser, so the scheduler
# lives here and we run the same browser flow the human runs.
#
# Two steps, in order (the CRM fix is invisible on the dashboards until the
# streams re-ingest it, so both must run together):
#   1. scripts/apex/freshenObservabilityDates.apex  — realign the 2 stored
#      End_Timestamp fields to their TODAY()-relative formula Start (idempotent).
#   2. scripts/refreshDataStreams.mjs               — Full-Refresh the 13 streams
#      so Data Cloud re-ingests today's rolling-window values.
# See ARCHITECTURE.md §3f.
#
# AUTH — DELIBERATELY NOT the same app/user as release-notes.yml (SECRETS.md).
# The Playwright step bridges the JWT session into a Lightning web session via
# frontdoor.jsp; that needs a WEB-scoped OAuth session. The shared Skywave_Heroku_Relay
# app grants only Api/RefreshToken/CDP (no Web) on purpose, so a relay JWT session
# bounces to login. This workflow therefore authenticates as a DEDICATED identity:
#   app  = Skywave_CI_Refresh  (JWT-bearer, adds the Web scope; same keypair as relay)
#   user = skywave.refresh.bot@skywave-interactive.demo (Standard User + the
#          Data Cloud/analytics permsets that let it open DataStream pages & Full-Refresh)
# The bot is pre-authorized on the app via the Skywave_Heroku_Website permset.
# Repo secrets consumed:
#   SF_REFRESH_CONSUMER_KEY   consumer key of the Skywave_CI_Refresh app
#   SF_REFRESH_USERNAME       skywave.refresh.bot@skywave-interactive.demo (not secret; kept as a secret for parity)
#   SF_JWT_KEY                PEM private key (contents of secrets/jwt.key) — SHARED with release-notes (one keypair)
#   SF_INSTANCE_URL           optional login URL (default https://login.salesforce.com works for this SDO)
#
# If the refresh clicks ever fail (missing Data Cloud/UI access, app not authorized,
# or a Lightning DOM change), this workflow files a failure issue (below).

on:
  # NO schedule here on purpose. This org (sfdc-qbranch-emu) enforces a GitHub IP
  # allow list that blocks GitHub-hosted runners (dynamic IPs) — a scheduled run
  # here fails at `actions/checkout` with a 403, and notify-failure can't even
  # file its alert (it 403s on checkout too). The DAILY scheduled job therefore
  # lives in a personal-account mirror with no org allow list:
  #     t-birke/skywave-observability-refresh  (cron '0 9 * * *')
  # This copy is kept as the canonical source of the scripts + design. It's
  # dispatch-only: use it manually if/when run from an allow-listed context
  # (e.g. a future self-hosted runner). Keep the mirror's copies in sync.
  workflow_dispatch:

# github-script needs issues:write to file the failure alert; checkout needs read.
permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps + Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli@latest

      - name: Write JWT key
        run: printf '%s' "$SF_JWT_KEY" > "$RUNNER_TEMP/jwt.key"
        env:
          SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}

      - name: Authenticate to org (JWT)
        run: |
          sf org login jwt \
            --client-id "$SF_REFRESH_CONSUMER_KEY" \
            --jwt-key-file "$RUNNER_TEMP/jwt.key" \
            --username "$SF_REFRESH_USERNAME" \
            --instance-url "${SF_INSTANCE_URL:-https://login.salesforce.com}" \
            --alias ci --set-default
        env:
          SF_REFRESH_CONSUMER_KEY: ${{ secrets.SF_REFRESH_CONSUMER_KEY }}
          SF_REFRESH_USERNAME: ${{ secrets.SF_REFRESH_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}

      - name: Realign stored End_Timestamp fields (Apex)
        # Verify with scripts/ci/check_apex_result.py, NOT jq: `sf apex run --json`
        # embeds NUL/control bytes in .result.logs that jq rejects and bash $()
        # corrupts — a false failure. The script parses the file leniently. See its header.
        run: |
          sf apex run --target-org ci --file scripts/apex/freshenObservabilityDates.apex --json > "$RUNNER_TEMP/apex.json" 2>/dev/null || true
          python3 scripts/ci/check_apex_result.py "$RUNNER_TEMP/apex.json"

      - name: Full-Refresh observability data streams (Playwright)
        run: node scripts/refreshDataStreams.mjs --target-org ci

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/jwt.key"

  # Guaranteed failure alert: file (or comment on) a single tracking issue so a
  # failed run surfaces regardless of anyone's email-notification settings.
  notify-failure:
    needs: refresh
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const runUrl = process.env.RUN_URL;
            const label = 'observability-refresh-failure';
            const marker = '<!-- refresh-observability-failure -->';
            const body = [
              marker,
              'The **refresh-observability** workflow failed.',
              '',
              `- Run: ${runUrl}`,
              `- Triggered by: \`${context.eventName}\``,
              `- Commit: ${context.sha}`,
              '',
              'Likely causes: the JWT subject user lacks Data Cloud/UI access to the',
              'DataStream pages, a Lightning DOM change broke the Playwright selectors,',
              'or an org/auth issue. Fallback: run the two steps by hand (see the',
              '`scripts/refreshDataStreams.mjs` header) or Dev Console',
              '`Skywave_DataStreamRunner.refreshSdoAnalyticsStreams()`.',
            ].join('\n');
            // Ensure the label exists (ignore if it already does).
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205',
                description: 'Automated: refresh-observability workflow failed' });
            } catch (e) { /* already exists */ }
            // One open tracking issue: comment if present, else create.
            const existing = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label, per_page: 1 });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo,
                title: 'Observability dashboard refresh failed', labels: [label], body });
            }
