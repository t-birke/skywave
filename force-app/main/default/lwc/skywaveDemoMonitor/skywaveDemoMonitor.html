<template>
    <div class="container slds-p-around_large">
        <div class="header slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <div>
                <div class="title">Skywave Interactive</div>
                <template lwc:if={demoSessionName}>
                    <div class="subtitle">{demoSessionName} · {activeCount} active sessions</div>
                </template>
                <template lwc:else>
                    <div class="subtitle warn">No active Demo Session</div>
                </template>
            </div>
            <div>
                <lightning-button-stateful
                    label-when-off="QR off"
                    label-when-on="QR on"
                    label-when-hover="toggle QR"
                    icon-name-when-off="utility:close"
                    icon-name-when-on="utility:check"
                    icon-name-when-hover="utility:check"
                    selected={qrCodeVisible}
                    onclick={toggleQrCodeVisibility}
                    variant="bare">
                </lightning-button-stateful>
            </div>
        </div>

        <div class="state-pill">
            <div class="state-label">CURRENT STAGE</div>
            <div class="state-value">{currentState}</div>
        </div>
    </div>

    <template lwc:if={qrCodeVisible}>
        <div class={qrcodeClass} onclick={toggleenlarge}>
            <template lwc:if={qrCodeGenerated}></template>
            <template lwc:else>
                <lightning-spinner alternative-text="Loading" size="small" variant="base"></lightning-spinner>
            </template>
            <div class="qrcodecontainer slds-p-around_medium"></div>
        </div>
    </template>
</template>
