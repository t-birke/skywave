<template>
    <div class="container slds-p-around_large">
        <div class="header slds-grid slds-grid_align-spread slds-grid_vertical-align-start">
            <div class="title-block">
                <div class="title">Skywave Interactive</div>
                <template lwc:if={hasActive}>
                    <div class="subtitle">
                        <span class="customer">{customer}</span>
                        <template lwc:if={demoDate}><span class="dot">·</span><span>{demoDate}</span></template>
                        <span class="dot">·</span><span>{name}</span>
                        <span class="dot">·</span><span>{activeCount} active sessions</span>
                    </div>
                </template>
                <template lwc:else>
                    <div class="subtitle warn">No active Demo Session — pick one below or create a new one</div>
                </template>
            </div>
            <div class="qr-toggle">
                <lightning-button-stateful
                    label-when-off="QR off"
                    label-when-on="QR on"
                    label-when-hover="toggle QR"
                    icon-name-when-off="utility:close"
                    icon-name-when-on="utility:check"
                    icon-name-when-hover="utility:check"
                    selected={qrCodeVisible}
                    onclick={toggleQrCodeVisibility}
                    variant="bare">
                </lightning-button-stateful>
            </div>
        </div>

        <div class="picker-row">
            <lightning-record-picker
                label="Active demo session"
                placeholder="Search by customer, date, or DEMO-####"
                object-api-name="Demo_Session__c"
                value={activeId}
                display-info={pickerDisplayInfo}
                matching-info={pickerMatchingInfo}
                onchange={handleSessionChange}>
            </lightning-record-picker>
        </div>

        <div class="state-block">
            <div class="state-label">CURRENT STAGE</div>
            <div class="state-value">{currentStateLabel}</div>
        </div>

        <template lwc:if={hasActive}>
            <div class="stage-strip">
                <template for:each={stageButtons} for:item="s">
                    <button
                        key={s.value}
                        class={s.cssClass}
                        data-state={s.value}
                        onclick={handleStageClick}>{s.label}</button>
                </template>
            </div>
        </template>
    </div>

    <template lwc:if={qrCodeVisible}>
        <div class={qrcodeClass} onclick={toggleenlarge}>
            <template lwc:if={qrCodeGenerated}></template>
            <template lwc:else>
                <lightning-spinner alternative-text="Loading" size="small" variant="base"></lightning-spinner>
            </template>
            <div class="qrcodecontainer slds-p-around_medium"></div>
        </div>
    </template>
</template>
