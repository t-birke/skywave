<template>
    <article class="assistant">
        <header class="header">
            <lightning-icon icon-name="standard:agent_astro" size="small" alternative-text=""></lightning-icon>
            <h2 class="slds-text-heading_medium header-title">Agentforce Service Assistant</h2>
            <button class="info" type="button" aria-label="Learn more">
                <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
            </button>
        </header>

        <div class="scroll-area">
            <section class="intro" style={heroStyle}>
                <div class="slds-text-body_small intro-copy">
                    Hi! I'm your Service Assistant, an intelligent companion powered by Agentforce.
                    My job is to prepare information and stage actions for you in the background.
                    Everything I find is linked back to the record.
                </div>
                <a href="javascript:void(0);" class="slds-text-body_small learn-more">Learn more…</a>
            </section>

        <section class={catchUpClass}>
            <button class="catch-up-toggle" type="button" onclick={handleToggleCatchUp} aria-expanded={catchUpExpanded}>
                <lightning-icon icon-name={catchUpIcon} size="x-small"></lightning-icon>
                <lightning-icon icon-name="standard:messaging_conversation" size="small" alternative-text=""></lightning-icon>
                <span class="catch-up-title">Conversation Catch Up</span>
            </button>

            <template lwc:if={catchUpExpanded}>
                <div class="catch-up-body">
                    <template lwc:if={summaryCreated}>
                        <p class="created">Summary created on {summaryCreated}</p>
                    </template>

                    <p class="summary">{summary}</p>

                    <div class="divider"></div>

                    <h3 class="section-label">Topic</h3>
                    <p class="summary">{topic}</p>

                    <div class="actions">
                        <lightning-button-icon
                            icon-name="utility:bolt"
                            variant="bare"
                            alternative-text="Run action"
                            size="small">
                        </lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:bolt"
                            variant="bare"
                            alternative-text="Run action"
                            size="small">
                        </lightning-button-icon>
                        <lightning-button-icon
                            icon-name="utility:copy_to_clipboard"
                            variant="bare"
                            alternative-text="Copy"
                            size="small">
                        </lightning-button-icon>
                    </div>
                </div>
            </template>
        </section>
        </div>

        <footer class="prompt">
            <div class="prompt-field">
                <textarea
                    class="prompt-input"
                    placeholder="Ask a question or trigger Agentforce actions…"
                    rows="2"
                    aria-label="Agentforce Prompt"
                ></textarea>
                <button class="send" type="button" aria-label="Send">
                    <lightning-icon icon-name="utility:send" size="x-small"></lightning-icon>
                </button>
            </div>
        </footer>
    </article>
</template>
